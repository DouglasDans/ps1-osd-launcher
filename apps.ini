[apps]
Duckstation = env XDG_RUNTIME_DIR=/run/user/1000 XCURSOR_SIZE=1 XCURSOR_THEME=invisible cage -- ~/emulators/duckstation/DuckStation-arm64.AppImage -bigpicture
PPSSPP = env XDG_RUNTIME_DIR=/run/user/1000 cage ~/emulators/ppsspp/PPSSPPSDL
RetroArch = env XDG_RUNTIME_DIR=/run/user/1000 cage -- retroarch
Stats = bash ~/scripts/stats.sh
Reboot = !sudo reboot
Shutdown = !sudo shutdown -h now
